apis:
- name: Percepto AIM API
  description: 'The HTTP API behind the Percepto AIM (Autonomous Inspection and Monitoring)
    console at drones.percepto.co. The application is a Django/Django-REST-Framework deployment:
    /api/schema/ and /api/docs/ are live routes (both HTTP 302 to /loginview/?next=... for an
    anonymous caller) while sibling paths such as /api/ and /swagger.json return the application
    404 page, which establishes that an API and a machine-readable schema exist under /api/ but
    are reachable only by an authenticated Percepto customer. No public OpenAPI, no public
    reference and no developer portal were found on any Percepto host.'
  humanURL: https://drones.percepto.co/
  baseURL: https://drones.percepto.co/api
  tags:
  - Drones
  - Industrial Inspection
  - Autonomous Systems
  x-access: customer-only
  x-base-url-evidence: 'Inferred from two observed live routes under /api/ (GET
    https://drones.percepto.co/api/schema/ -> 302 Location /loginview/?next=/api/schema/ and GET
    https://drones.percepto.co/api/docs/ -> 302 Location /loginview/?next=/api/docs/, probed
    2026-08-26). Percepto publishes no documented base URL; this is not stated by the provider.'
  properties:
