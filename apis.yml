aid: percepto
name: Percepto
description: 'Percepto is an Israeli-founded industrial autonomy company (founded 2014, offices
  in Modi''in, Israel and the United States) that builds drone-in-a-box hardware and the software
  that runs it. Its hardware line includes the Percepto Air Max and Air Mobile drones and the
  Percepto Base docking station, and its software product is Percepto AIM (Autonomous Inspection
  and Monitoring), a platform that plans and launches autonomous missions, ingests visual, thermal,
  optical-gas-imaging and 3D data from Percepto drones as well as third-party DJI drones and fixed
  cameras, and applies AI-driven analytics to produce inspection, monitoring, emergency-response
  and security insights for oil and gas, mining, electric utilities, solar, ports and heavy
  industry sites. Percepto holds FAA beyond-visual-line-of-sight (BVLOS) authorizations for
  automated industrial inspections and has raised approximately $138.6M. The Percepto AIM console
  is served at drones.percepto.co and exposes an HTTP API under /api/, but the API schema and API
  documentation routes both redirect anonymous callers to a customer login: Percepto publishes no
  public developer portal, no OpenAPI document and no public API reference.'
